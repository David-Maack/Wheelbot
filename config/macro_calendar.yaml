# Hand-curated macro event calendar — fallback when Finnhub is unavailable
# or FINNHUB_API_KEY isn't set.
#
# Used by data/macro_calendar.py::load_yaml_calendar(). Same canonical
# event_type values as the Finnhub adapter writes (FOMC | CPI | NFP | PPI |
# GDP | JOLTS | OTHER).
#
# valid_until — refresh THIS file before this date or the loader logs
# `macro_yaml_stale_human_attention` (fires when within 30 days of expiry,
# escalates when past). Source for dates: official US economic releases
# calendar (BLS, BEA, Federal Reserve).
#
# Pulled 2026-06-03 from public release calendars. Cross-check before
# trusting in production.

valid_until: 2026-09-30

events:
