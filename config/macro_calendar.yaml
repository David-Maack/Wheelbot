  - { date: 2026-06-11, event_type: CPI,  impact: high, description: "CPI YoY (May 2026 release)" }
  - { date: 2026-06-17, event_type: FOMC, impact: high, description: "FOMC Statement + Press Conference" }

  # July 2026
