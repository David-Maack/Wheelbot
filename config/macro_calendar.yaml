# Macro event calendar — the ONLY source for the macro blackout (2026-10-27).
#
# Finnhub's /calendar/economic returns 403 on our plan; since June 2026 the
# refresh silently fell back to this file, which expired 2026-09-30, so the
# blackout had no event after 2026-09-16 (FOMC 2026-10-28 was invisible).
# This file is now authoritative: scripts/refresh_macro_calendar replaces
# every macro_events row dated today-or-later with exactly these events.
#
# Used by data/macro_calendar.py::load_yaml_calendar(). event_type values:
# FOMC | CPI | NFP (anything else is stored but no rule reads it).
#
# Dates are the event DAY in America/New_York: FOMC = decision day (2nd day
# of the meeting, statement 14:00 ET); CPI and NFP = release day (08:30 ET).
#
# Sources (pulled 2026-10-27):
#   FOMC  https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#         (2027 dates are tentative until confirmed at the preceding meeting)
#   CPI   https://www.bls.gov/schedule/news_release/cpi.htm
#   NFP   https://www.bls.gov/schedule/news_release/empsit.htm
#
# valid_until — the last date this file covers. The refresh logs
# `macro_yaml_stale_human_attention` within 30 days of it, and the risk gate
# treats the calendar as stale (fail-open + Discord) once any configured
# event type has no event within risk.macro_blackout.min_coverage_days.
# Extend this file from the sources above before then.

valid_until: 2027-12-10

