# WheelBot defaults. Committed to repo. Override in config.local.yaml.
# See spec §5.

account:
  id: "primary"
  broker: "alpaca_paper"        # alpaca_paper | tastytrade_sandbox | tastytrade
  # Sprint 12 sub-sprint 4: global cap on active positions across ALL strategies.
  # Per-strategy caps (max_concurrent on each strategy) are additionally enforced;
  # this is the ceiling. Sized for a small live bankroll — on $5-wide spreads,
  # 4 simultaneous positions = ~$1400 max exposure. Raise as the account grows.
  max_concurrent_total: 4

database:
  path: "/mnt/wheelbot-storage/wheelbot.db"

logging:
  level: "INFO"
  json: true
  path: "/mnt/wheelbot-storage/logs/wheelbot.log"

dashboard:
  host: "127.0.0.1"
  port: 8889
  basic_auth_user: "wheelbot"   # password lives in secrets.env

reconciler:
  market_hours_interval_seconds: 300
  off_hours_interval_seconds: 1800
  max_failures_before_pause: 5

wheel:
  # Strike selection
  csp_delta_min: 0.20
  csp_delta_max: 0.30
  cc_delta_min: 0.20
  cc_delta_max: 0.30
  cc_strike_floor: cost_basis    # never sell CC below cost basis

  # Time
  dte_min: 30
  dte_max: 45
  weekly_only: false             # if true, only trade contracts with weekly expiries

  # Entry gates
  ivr_min: 30                    # don't sell premium when premium is cheap
  bid_ask_spread_max_pct: 5      # skip illiquid contracts (spread > 5% of mid)
  open_interest_min: 500
  volume_min: 100                # contract daily volume

  # Earnings handling
  earnings_blackout_days_before: 5
  earnings_blackout_days_after: 2
  earnings_low_delta_override: 0.10

  # Exit / management
  profit_close_pct: 50           # close at 50% max profit
  time_close_dte: 7              # close any position with <= 7 DTE remaining
  roll_trigger_delta: 0.50       # consider roll when short option's delta hits this
  roll_only_for_credit: true     # never debit-roll

  # Position sizing
  max_position_pct_of_account: 30
  max_concurrent_positions: 4
  buying_power_floor_pct: 20

risk:
  daily_loss_kill_switch_pct: 5  # if account drops 5% in a day, halt new trades
  consecutive_losses_pause: 3    # 3 losses in a row → pause for human review
  stop_file_path: "/opt/wheelbot/STOP"

regime:
  enabled: true
  spy_above_sma_days: 200
  vix_max: 35
  pause_on_vix_spike_pct: 30

intelligence:
  llm_screener_enabled: true
  llm_news_check_enabled: true
  llm_roll_advisor_enabled: false   # turn on after collecting 3+ months of data
  llm_provider: anthropic
  screener_model: claude-opus-4-7
  news_check_model: claude-haiku-4-5
  roll_advisor_models:              # ensemble vote
    - claude-opus-4-7
    - claude-haiku-4-5
  ensemble_quorum: 2                # need N agreeing models to act

  # Daily LLM-spend cap. The Anthropic client refuses calls that would push
  # today's total above this. Screener and news_check fail-open (skip + log)
  # when exceeded; the router still places orders.
  # Bumped to $2.00 to leave room for: 1 screener run (~$0.40 actual / ~$0.40
  # worst-case at 4096 tokens) + a day of news_checks (~$0.10) + retry
  # buffer. Was $1.00 in Phase 1 paper bring-up.
  daily_budget_usd: 2.00

  # Per-call output token budgets — also used as the worst-case max for the
  # pre-call budget check, which is why these aren't set to the model's hard
  # max. screener at 4096 covers ~50 ticker entries (we have 32), keeps
  # worst-case cost ~$0.38 under the $1.00 / day cap with room for news+retries.
  screener_max_tokens: 4096

  # Sprint 14: tier-2 LLM screen gate. Tier-2 ticker entries (HOOD, PLTR,
  # COIN, MARA, RIVN, AAL, PLUG, WBA) require a candidate row from today's
  # screener run with score >= this threshold. Tier-1 tickers bypass.
  # Bear-call direction also bypasses — current screener prompt is bullish
  # biased; using it to gate bear-calls would be wrong direction.
  tier2_min_score: 50
  news_check_max_tokens: 256
  roll_advisor_max_tokens: 384

  # Pluggable news source. make_news_source() in intelligence/news.py
  # dispatches on this. Currently implemented: "finnhub". Plug in
  # newsapi.org / Marketaux / Polygon / Alpaca News by adding a single
  # adapter class.
  news_source: finnhub

  # Pricing overrides ($ per 1M tokens). Only set when Anthropic adjusts
  # prices. Defaults are baked into intelligence/budget.py:
  #   claude-opus-4-7    $15.00 / $75.00
  #   claude-sonnet-4-6   $3.00 / $15.00
  #   claude-haiku-4-5    $1.00 /  $5.00
  # pricing:
  #   claude-opus-4-7:
  #     input_per_mtok: 15.0
  #     output_per_mtok: 75.0

notifications:
  # NullNotifier when false (events still logged via core/checkpoint).
  enabled: true
  # When DISCORD_WEBHOOK_URL is set in secrets.env AND this is true,
  # state-change + risk events post to the Discord webhook.
  discord_enabled: true

execution:
  dry_run: false
  retry_max_attempts: 5
  retry_initial_backoff_seconds: 1
  retry_max_backoff_seconds: 60

# Strategies registry. The bot iterates these each tick and dispatches by
# `type` to the right orchestrator. A ticker belongs to a strategy iff its
# `strategies:` list in universe.yaml contains the strategy id.
#
# `params` overlays the legacy `wheel:` block above for `type: wheel`
# strategies — anything in `params` wins.
strategies:
  - id: monthly_wheel
    display_name: "Monthly Wheel"
    type: wheel
    enabled: true
    max_concurrent: 4
    params:
      dte_min: 30
      dte_max: 45
      csp_delta_min: 0.20
      csp_delta_max: 0.30
      cc_delta_min: 0.20
      cc_delta_max: 0.30
      profit_close_pct: 50
      # Sprint 12 sub-sprint 5: IVR soft filter. Skip entry when IV rank is
      # below 30 (premium too low, edge thin). Falls through silently when
      # iv_history has < 20 days (paper bring-up safety).
      ivr_min: 30
      # Sprint 13 sub-sprint 1: drawdown circuit breaker. If realized P&L
      # over the last 7 days drops below this threshold, the strategy is
      # auto-disabled for 30 days (manual re-enable available). Set to 0
      # to disable the feature for this strategy.
      auto_disable_drawdown_usd: -300
      # Sprint 13 sub-sprint 2: extend the Sprint 12 DTE-21 rule to wheel
      # CSPs and CCs. Same gamma-cliff rationale: bulk of max-loss outcomes
      # cluster in the final 21 days, so exit and rotate to a fresh 45-DTE
      # short. NOT set on weekly_wheel — those positions enter at DTE 7-14,
      # so they live entirely inside the gamma window; the rule doesn't
      # transfer cleanly.
      time_close_dte: 21
      # Sprint 14: CSP stop-loss. Closes the short put when current mid
      # hits 2× the original premium received. Caps a runaway loss before
      # assignment risk dominates. CC stop-loss is intentionally not set —
      # called-away is the wheel's profitable outcome, not a loss to exit.
      csp_stop_loss_mult: 2.0

  - id: weekly_wheel
    display_name: "Weekly Wheel"
    type: wheel
    enabled: true
    max_concurrent: 4
    params:
      dte_min: 7
      dte_max: 14
      # Tighter delta band — weekly gamma is unforgiving, stay further OTM.
      csp_delta_min: 0.15
      csp_delta_max: 0.25
      cc_delta_min: 0.15
      cc_delta_max: 0.25
      # Close earlier — capture theta then redeploy capital.
      profit_close_pct: 50
      # Higher trigger to roll because weeklies move into ITM faster.
      roll_trigger_delta: 0.45
      # IVR soft filter — see monthly_wheel.
      ivr_min: 30
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      # CSP stop-loss — see monthly_wheel.
      csp_stop_loss_mult: 2.0

  - id: put_spread
    display_name: "Bull Put Spread"
    type: vertical_spread
    enabled: true
    max_concurrent: 4
    params:
      direction: bull_put
      dte_min: 30
      dte_max: 45
      short_delta_min: 0.20
      short_delta_max: 0.30
      # $5 width sized for the mega-cap universe ($150–$700 underlyings).
      # A $1 width yields near-zero credit at 25Δ on these strikes.
      spread_width_dollars: 5.0
      # Cap per-package max-loss exposure so quantity stays small while we
      # learn how the strategy behaves on this universe.
      max_capital_per_spread_usd: 500
      profit_close_pct: 50
      # Sprint 12 sub-sprint 1: DTE 7 → 21. The "21-DTE rule" is the
      # most-replicated finding in retail options research — gamma
      # acceleration in the final 21 days overwhelms remaining theta and
      # produces the bulk of max-loss outcomes. tastytrade 200K+ trade
      # analysis + Option Alpha independent backtest agree.
      time_close_dte: 21
      # Sprint 12 sub-sprint 2: stop-loss at 2× credit received. Caps the
      # tail at ~60% of max loss on a $5-wide spread. Critical on small
      # accounts where a single max-loss spread is 7-17% of the bankroll.
      stop_loss_mult: 2.0
      # Sprint 12 sub-sprint 5: IVR soft filter — see monthly_wheel.
      ivr_min: 30
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300

  - id: bear_call_spread
    display_name: "Bear Call Spread"
    type: vertical_spread
    enabled: true
    max_concurrent: 4
    params:
      direction: bear_call
      dte_min: 30
      dte_max: 45
      short_delta_min: 0.20
      short_delta_max: 0.30
      # $5 width — same sizing as put_spread for cross-strategy comparability.
      spread_width_dollars: 5.0
      max_capital_per_spread_usd: 500
      # Sprint 12 sub-sprint 3: bear-call profit target tightened to 35%
      # (vs bull-put 50%). Asymmetric — equity indices have structural
      # upward drift and IV skew makes calls pay less credit at equivalent
      # delta. Faster exit reduces time exposed to melt-up scenarios.
      # No published A/B study; logic-based off the asymmetry data.
      profit_close_pct: 35
      # See put_spread above. Same rule applies to bear-call spreads.
      time_close_dte: 21
      # Tighter stop than bull puts (2× → 1.5×). Bear-call asymmetric
      # melt-up risk: when equity indices break upward they do so violently,
      # so waiting for 2× often means realized loss is close to max.
      stop_loss_mult: 1.5
      # Sprint 12 sub-sprint 5: IVR soft filter — see monthly_wheel.
      ivr_min: 30
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
