# WheelBot defaults. Committed to repo. Override in config.local.yaml.
# See spec §5.

account:
  id: "primary"
  broker: "alpaca_paper"        # alpaca_paper | tastytrade_sandbox | tastytrade
  # Sprint 12 sub-sprint 4: global cap on active positions across ALL strategies.
  # Per-strategy caps (max_concurrent on each strategy) are additionally enforced;
  # this is the ceiling.
  #
  # $5K SMALL-BANKROLL SIM (2026-06-17): only defined-risk strategies run —
  # iron_condor + put_spread (bull put) + calendar. Wheel (monthly/weekly),
  # bear_call_spread, and pmcc are disabled below (wheel = too capital-heavy for
  # $5k; pmcc LEAPs cost more than the whole account; bear_call out of scope).
  # Tightened to 4 — on $5-wide spreads, 4 simultaneous positions ≈ $1400 max
  # exposure on a $5,000 paper account. Pair with an Alpaca paper reset to $5k.
  # 2026-07-01: virtual book re-based $5k -> $12k (assumed live funding).
  # Worst-case simultaneous at 6 slots ~= $10.9k (swing 4.5k + wheel CSPs ~3.9k
  # + pmcc 1.5k + condor 0.5k + spread 0.5k) - bounded under $12k; live, the
  # buying-power floor binds first.
  max_concurrent_total: 6

database:
  path: "/mnt/wheelbot-storage/wheelbot.db"

logging:
  level: "INFO"
  json: true
  path: "/mnt/wheelbot-storage/logs/wheelbot.log"

dashboard:
  host: "127.0.0.1"
  port: 8889
  basic_auth_user: "wheelbot"   # password lives in secrets.env

reconciler:
  market_hours_interval_seconds: 300
  off_hours_interval_seconds: 1800
  max_failures_before_pause: 5

wheel:
  # Strike selection
  csp_delta_min: 0.20
  csp_delta_max: 0.30
  cc_delta_min: 0.20
  cc_delta_max: 0.30
  cc_strike_floor: cost_basis    # never sell CC below cost basis

  # Time
  dte_min: 30
  dte_max: 45
  weekly_only: false             # if true, only trade contracts with weekly expiries

  # Entry gates
  ivr_min: 30                    # don't sell premium when premium is cheap
  bid_ask_spread_max_pct: 5      # skip illiquid contracts (spread > 5% of mid)
  open_interest_min: 0           # Alpaca PAPER feed returns no OI/volume (always 0), so any >0 floor blocks every single-leg entry (e.g. the PMCC long). bid_ask_spread_max_pct above is the liquidity proxy. RESTORE 500 for a live broker that populates OI (Tastytrade).
  volume_min: 0                  # ^ same — RESTORE 100 before live

  # Earnings handling
  earnings_blackout_days_before: 5
  earnings_blackout_days_after: 2
  earnings_low_delta_override: 0.10

  # Exit / management
  profit_close_pct: 50           # close at 50% max profit
  time_close_dte: 7              # close any position with <= 7 DTE remaining
  roll_trigger_delta: 0.50       # consider roll when short option's delta hits this
  roll_only_for_credit: true     # never debit-roll

  # Position sizing
  max_position_pct_of_account: 30
  max_concurrent_positions: 4
  buying_power_floor_pct: 20

# Ops MCP (scripts/run_mcp): read tools always on; control tools gated by
# controls_enabled (shipped ON — the bearer token + private port binding are
# the guards). Requires WHEELBOT_MCP_TOKEN in secrets.env; the server refuses
# to start without it. See docs/MCP.md.
mcp:
  host: "0.0.0.0"
  port: 8890
  controls_enabled: true

regime:
  enabled: true
  spy_above_sma_days: 200
  vix_max: 35
  pause_on_vix_spike_pct: 30

intelligence:
  llm_screener_enabled: true
  llm_news_check_enabled: true
  # news_check enforcement. TESTING PHASE = advisory: a "caution" verdict is
  # logged (visible in /decisions) but the CSP proceeds at full size; only a
  # hard "block" cancels. Keeps wheel data volume up while Haiku tends to
  # caution-on-everything. FLIP TO false (full enforcement: caution halves,
  # 1-lot caution => block) before going live on the real bankroll.
  news_check_advisory: true
  llm_roll_advisor_enabled: false   # turn on after collecting 3+ months of data
  # 2026-07-01 AI audit item #2: daily reduce-only regime exception veto. Once
  # a day (run_regime cron) the LLM reads the NUMERIC regime dossier + general
  # headlines and may flag "material risk the numbers can't see" — which halves
  # all entry sizes for the day. It can never increase risk; every failure
  # fails open to no-veto. ~1 Haiku call/day. Armed 2026-07-01 per David
  # (reduce-only, so the conservative-default convention is satisfied by
  # construction — it can only ever make the bot more careful).
  llm_regime_veto_enabled: true
  regime_veto_model: claude-haiku-4-5
  # AI audit item #5: adversarial bull/bear second read of the screener's top-3
  # (one extra Haiku call/day, adjusts scores ±15, annotates rationales; every
  # failure fails open to the single-pass scores). Armed 2026-07-01 for the
  # paper proof-of-concept.
  adversarial_screener_enabled: true
  adversarial_model: claude-haiku-4-5
  llm_provider: anthropic
  screener_model: claude-opus-4-7
  news_check_model: claude-haiku-4-5
  roll_advisor_models:              # ensemble vote
    - claude-opus-4-7
    - claude-haiku-4-5
  ensemble_quorum: 2                # need N agreeing models to act

  # Daily LLM-spend cap. The Anthropic client refuses calls that would push
  # today's total above this. Screener and news_check fail-open (skip + log)
  # when exceeded; the router still places orders.
  # Bumped to $2.00 to leave room for: 1 screener run (~$0.40 actual / ~$0.40
  # worst-case at 4096 tokens) + a day of news_checks (~$0.10) + retry
  # buffer. Was $1.00 in Phase 1 paper bring-up.
  daily_budget_usd: 2.00

  # Per-call output token budgets — also used as the worst-case max for the
  # pre-call budget check, which is why these aren't set to the model's hard
  # max. screener at 4096 covers ~50 ticker entries (we have 32), keeps
  # worst-case cost ~$0.38 under the $1.00 / day cap with room for news+retries.
  screener_max_tokens: 4096

  # Sprint 14: tier-2 LLM screen gate. Tier-2 ticker entries (HOOD, PLTR,
  # COIN, MARA, RIVN, AAL, PLUG, WBA) require a candidate row from today's
  # screener run with score >= this threshold. Tier-1 tickers bypass.
  # Bear-call direction also bypasses — current screener prompt is bullish
  # biased; using it to gate bear-calls would be wrong direction.
  tier2_min_score: 50
  news_check_max_tokens: 256
  roll_advisor_max_tokens: 384

  # Pluggable news source. make_news_source() in intelligence/news.py
  # dispatches on this. Currently implemented: "finnhub". Plug in
  # newsapi.org / Marketaux / Polygon / Alpaca News by adding a single
  # adapter class.
  news_source: finnhub

  # Pricing overrides ($ per 1M tokens). Only set when Anthropic adjusts
  # prices. Defaults are baked into intelligence/budget.py:
  #   claude-opus-4-7    $15.00 / $75.00
  #   claude-sonnet-4-6   $3.00 / $15.00
  #   claude-haiku-4-5    $1.00 /  $5.00
  # pricing:
  #   claude-opus-4-7:
  #     input_per_mtok: 15.0
  #     output_per_mtok: 75.0

# Weekly dynamic universe refresh (two-tier: quant pre-filter + LLM rank).
# Proposes per-strategy watchlist changes as add/keep/drop diffs; the bot only
# consumes a run once it is APPLIED. Spec §6 ("never auto-add tickers without
# human review") is preserved by default: runs land as PROPOSED and are applied
# via the MCP approve_watchlist tool. Watchlist membership only controls what a
# strategy LOOKS AT — every entry still passes the full risk gate at trade
# time, and symbols the refresh introduces that have no universe.yaml entry are
# synthesized at tier 2 (require a same-day screener score to trade).
# Cron: 0 7 * * 6 (Saturday 07:00 MDT) — python -m scripts.run_universe_refresh
universe_refresh:
  enabled: true                 # armed 2026-07-02 — cron runs Saturdays; proposals still need human approval
  auto_apply: false             # true = apply proposals without human review (earn trust first)
  model: claude-opus-4-7
  max_output_tokens: 4096
  # Churn guardrails (enforced in code, not just prompted).
  max_adds_per_strategy: 2
  max_drops_per_strategy: 2
  min_symbols_per_strategy: 3
  # Strategies the refresh never touches (single-symbol / signal-driven).
  exclude_strategies: [spy_swing_opt]
  # Tier-1 quant ADD gates. min_median_volume mirrors spec §6's tier-2
  # admission bar (median daily volume > 5M).
  min_price: 5.0
  max_price: 1200.0
  min_median_volume: 5000000
  earnings_min_days: 7
  # Extra symbols to consider beyond universe.yaml (parked names are always
  # considered). Add liquid optionable tickers here as the account grows.
  candidate_pool: []
  # Tier 0 — market discovery (armed 2026-07-02 per David): fold the top-N
  # most-active US stocks (Alpaca screener) into the candidate pool each run
  # so the LLM can match fresh names to strategy profiles. Discovered names
  # face extra hurdles beyond the quant gate: an option chain with at least
  # one quote tighter than chain_spread_max_pct must exist, only the top
  # max_new_candidates by dollar volume reach the LLM, and (like every add)
  # they enter at tier 2 + need your approval. Fail-open: screener errors
  # shrink the pool back to hand-curated.
  discovery:
    enabled: true
    top_n: 100
    max_new_candidates: 25
    chain_spread_max_pct: 15
  # Operator pins: never droppable, per strategy. Open-position symbols are
  # always protected regardless of this list.
  pinned: {}
  #  monthly_wheel: [F, T]

risk:
  daily_loss_kill_switch_pct: 5  # if account drops 5% in a day, halt new trades
  consecutive_losses_pause: 3    # 3 losses in a row → pause for human review

  # Kill-switch stop file on the SHARED volume so the bot, dashboard, and ops-MCP
  # containers all reach it (NOT /opt/wheelbot/STOP, which only the bot container
  # could touch).
  stop_file_path: "/mnt/wheelbot-storage/STOP"

  # TICKET-007: macro event blackout. Blocks NEW short premium entries whose
  # lifespan [today, expiration] would cross a high-impact macro event
  # (FOMC / CPI / NFP by default). Bypassed for closes — once a position is
  # open, the rule has nothing useful to say. bear_call_spread is NOT
  # bypassed (unlike the tier-2 LLM screen): macro events gap both directions.
  #
  # Populated by scripts/refresh_macro_calendar.py (daily cron). When Finnhub
  # is unavailable, falls back to config/macro_calendar.yaml (hand-curated;
  # refresh quarterly — loader warns when valid_until is within 30 days).
  macro_blackout:
    enabled: true
    event_types: [FOMC, CPI, NFP]
    blackout_days_before: 1
    blackout_days_after: 0
    # Entry-proximity (mirrors risk.earnings_blackout.entry_avoid_days): only
    # avoid OPENING when a macro event is within this many days of today, instead
    # of blocking any 30-45 DTE spread whose life merely reaches a routine
    # monthly NFP/CPI. Defined-risk + the 21-DTE close make this safe. Remove to
    # revert to the legacy full-life span behavior.
    # 2026-07-01 audit: at 7, NFP+CPI+FOMC each blocked ~8 calendar days -> only
    # ~7-8 open trading days per month. At 2 (+ blackout_days_before 1) each
    # event blocks ~2-3 trading days -> ~14+ open days. Further option if still
    # too tight: drop NFP/CPI from event_types and keep only FOMC.
    entry_avoid_days: 2
    refresh_interval_hours: 24
    stale_threshold_hours: 48
    finnhub_impact_min: "high"

  # TICKET-006: mid-cycle earnings recheck. Entry-time earnings blackout fires
  # at order placement, but companies often confirm earnings dates only 2-3
  # weeks in advance — a CSP opened cleanly can later have earnings inside its
  # remaining DTE. This re-runs the blackout check periodically on every open
  # short-premium position.
  #
  # Action 'flag_manual' (recommended testing default) flips the position to
  # MANUAL_INTERVENTION and notifies Discord — purely a state annotation, runs
  # even when the kill switch is tripped because the operator needs to see
  # the signal to act.
  #
  # Action 'close' builds a BUY_TO_CLOSE proposal and routes it. SKIPPED when
  # the kill switch is tripped (logs earnings_recheck_close_skipped_kill_switch
  # for audit). SPREAD_OPEN positions always fall back to flag_manual under
  # action='close' until a generic spread-close helper lands with TICKET-014.
  earnings_recheck:
    enabled: true
    check_interval_ticks: 12       # ~1h at 5-min cadence; 30 min at 2.5-min.
    action: flag_manual            # flag_manual | close
    # Same window the entry gate (risk/limits.py rule 4) uses by default. The
    # dashboard /positions earnings_warning badge reads from this block too,
    # so the badge and the actual recheck behaviour cannot diverge.
    days_before: 5
    days_after: 2
    # 2026-07-08: provider earnings dates are ESTIMATES and wobble. The flag
    # is a one-way latch, so when the date that justified it later moves OUT
    # of the window the position stays flagged and UNMANAGED (no profit
    # close, no DTE force-close — bit us on the SOFI calendar). The watchdog
    # re-evaluates earnings-recheck flags each pass and nudges Discord
    # (24h-limited) when one goes stale. Clearing stays MANUAL:
    # scripts/restore_position.py or the MCP unflag_position control.
    stale_flag_watchdog: true

  # Earnings ENTRY gate (risk/limits.py rule 4). entry_avoid_days switches the
  # gate from expiry-based (block any 30-45 DTE position whose life reaches
  # earnings — which sidelined the spread strategies for ~6 weeks every earnings
  # season) to ENTRY-PROXIMITY: only avoid OPENING when earnings is within this
  # many days of today. Defined-risk + the 21-DTE time-close make this safe —
  # spreads exit well before an expiry-date earnings. Remove this key to revert
  # to the legacy expiry-window + spans behavior.
  earnings_blackout:
    entry_avoid_days: 7

  # TICKET-009: win-rate floor per strategy. Catches the "still net-positive
  # in dollars but bleeding by frequency" failure mode the drawdown breaker
  # can't see. Looks at the most-recent N closed cycles; if win rate drops
  # below the floor, pauses the strategy and requires manual reenable.
  #
  # Why manual reenable (not auto-clear like drawdown 30d): low win rate is
  # evidence of a losing PATTERN, not a transient drawdown. Auto-clearing on
  # calendar timeout would silently re-arm a broken setup. paused_duration_days
  # is advisory only — the dashboard shows "eligible for reenable in N days"
  # so the operator knows when it's reasonable to revisit, but the bot
  # never auto-clears. Operators can reenable sooner if they have new info.
  #
  # Per-strategy override: each strategy can set `win_rate_floor_pct` in its
  # `params` to override the global `min_win_rate_pct`. Spreads vs wheels
  # have different intrinsic win rates (deep-OTM CSPs often >80%; tight
  # spreads ~65%) so one global threshold may be too blunt.
  win_rate_floor:
    enabled: true
    min_closed_cycles: 10
    min_win_rate_pct: 60
    pause_duration_days: 14

  # 2026-07-06 sprint: expectancy floor — the win-rate floor's companion,
  # catching what it structurally can't. Win rate is the wrong pause metric
  # for asymmetric payoffs: at the time of writing put_spread was LOSING
  # money at a passing 57% win rate ($54 avg wins vs -$150 stops) while
  # profitable monthly_wheel (+$150) sat one cycle from a win-rate pause at
  # 56%. This gauge pauses on mean $/cycle over the last N closed cycles
  # instead. Same contract as win_rate_floor: pause = manual reenable only
  # (scripts/reenable_strategy.py); shares the pause_state column
  # ('NEGATIVE_EXPECTANCY'); first floor to trip owns the pause.
  #
  # Per-strategy override: `expectancy_floor_usd` in strategy params.
  # Ships DISABLED (new-knob convention). Arm after eyeballing /risk's
  # expectancy panel for a few days — with only ~10 cycles per strategy on
  # the book, one refit changes the mean a lot.
  expectancy_floor:
    enabled: false
    min_closed_cycles: 10
    min_expectancy_usd: 0        # pause when mean $/cycle < this
    pause_duration_days: 14

  # 2026-07-06 sprint: regime-aware IVR entry floor. IVR is a RELATIVE
  # measure — in a sustained high-vol regime (2022-style) it reads "low"
  # for weeks while absolute premium is rich everywhere, because the rank
  # compares against an elevated 52-week high. When the latest regime
  # snapshot's VIX close is at/above vix_threshold, every strategy's
  # ivr_min drops by floor_delta (clamped at 0) so the bot doesn't skip
  # rich premium on a technicality. Calm-regime behavior is deliberately
  # UNCHANGED (the 2026-07-01 audit set the calm floors; the selector-level
  # min-credit rule already gates thin premium directly). Research basis:
  # regime-conditional IVR thresholds (NexusFi/VolatilityBox regime-filter
  # writeups). Per-strategy override: ivr_relax_vix / ivr_relax_delta in
  # strategy params. Remove this block (or floor_delta: 0) to disable.
  ivr_regime_relax:
    vix_threshold: 25            # VIX close >= this = "stressed" regime
    floor_delta: 10              # ivr_min -= this when stressed (min 0)

notifications:
  # NullNotifier when false (events still logged via core/checkpoint).
  enabled: true
  # When DISCORD_WEBHOOK_URL is set in secrets.env AND this is true,
  # state-change + risk events post to the Discord webhook.
  discord_enabled: true

execution:
  dry_run: false
  retry_max_attempts: 5
  retry_initial_backoff_seconds: 1
  retry_max_backoff_seconds: 60
  # Cancel + re-place a same-client_order_id PENDING order older than this
  # (minutes). Prevents stale limits sitting unfilled all session.
  stale_pending_minutes: 15
  # Concede this much net credit ($/share) on multi-leg spread OPENS so the
  # order is marketable. Mid-to-mid credit on a credit spread often won't
  # cross; giving up a nickel buys reliable fills. ~3% of a $1.50 credit.
  open_slippage: 0.05
  # Don't open NEW positions in the final N minutes before the 16:00 ET
  # close — no time to fill or manage. Closes/rolls are exempt.
  entry_cutoff_minutes_before_close: 15

# Strategies registry. The bot iterates these each tick and dispatches by
# `type` to the right orchestrator. A ticker belongs to a strategy iff its
# `strategies:` list in universe.yaml contains the strategy id.
#
# `params` overlays the legacy `wheel:` block above for `type: wheel`
# strategies — anything in `params` wins.
strategies:
  - id: monthly_wheel
    display_name: "Monthly Wheel"
    type: wheel
    enabled: true               # $12k book (2026-07-01): cheap-name CSPs (F ~$1.1k, NOK ~$0.5k) fit; was disabled on $5k — re-enable when bankroll grows
    max_concurrent: 2
    params:
      dte_min: 30
      dte_max: 45
      csp_delta_min: 0.20
      csp_delta_max: 0.30
      cc_delta_min: 0.20
      cc_delta_max: 0.30
      profit_close_pct: 50
      # Sprint 12 sub-sprint 5: IVR soft filter. Skip entry when IV rank is
      # below the floor (premium too low, edge thin). Falls through silently
      # when iv_history has < 20 days (paper bring-up safety).
      # 2026-07-01: 30 -> 20 alongside the re-enable — same rationale as the
      # spreads (universe IVR 13-25 in a calm bull made 30 a de-facto pause).
      ivr_min: 20
      # Sprint 13 sub-sprint 1: drawdown circuit breaker. If realized P&L
      # over the last 7 days drops below this threshold, the strategy is
      # auto-disabled for 30 days (manual re-enable available). Set to 0
      # to disable the feature for this strategy.
      auto_disable_drawdown_usd: -300
      # TICKET-008: intermediate WARNING tier — when 7d P&L drops below
      # this (but above auto_disable_drawdown_usd), new spread entries are
      # placed at HALF size. Wheel proposals stay at qty=1 (single-contract
      # CSPs can't halve — wheel_warning_size_unhalved logged once per
      # transition so the limitation is visible in the audit trail).
      # Set to 0 to disable just the WARNING tier (DISABLED still applies).
      drawdown_warning_usd: -150
      # Sprint 13 sub-sprint 2: extend the Sprint 12 DTE-21 rule to wheel
      # CSPs and CCs. Same gamma-cliff rationale: bulk of max-loss outcomes
      # cluster in the final 21 days, so exit and rotate to a fresh 45-DTE
      # short. NOT set on weekly_wheel — those positions enter at DTE 7-14,
      # so they live entirely inside the gamma window; the rule doesn't
      # transfer cleanly.
      time_close_dte: 21
      # Sprint 14: CSP stop-loss. Closes the short put when current mid
      # hits 2× the original premium received. Caps a runaway loss before
      # assignment risk dominates. CC stop-loss is intentionally not set —
      # called-away is the wheel's profitable outcome, not a loss to exit.
      csp_stop_loss_mult: 2.0
      # TICKET-005: delta-based hard stop. Price-based stop alone leaves you
      # gamma-exposed near the money (delta 0.20 → 0.55 without 2× premium
      # move on a steady drift). Action 'roll' defers to the reconciler's
      # roll evaluator (which fires at roll_trigger_delta=0.50, comfortably
      # below 0.55); the fallback kicks in only if the roll declined AND we
      # have <= 14 days left, which is plenty of room on the 30-45 DTE band.
      delta_stop_threshold: 0.55
      delta_stop_action: roll
      delta_stop_roll_fallback_dte: 14
      delta_stop_stuck_alert_ticks: 12

  - id: weekly_wheel
    display_name: "Weekly Wheel"
    type: wheel
    enabled: false              # $5k sim: wheel is too capital-heavy — re-enable when bankroll grows
    max_concurrent: 4
    params:
      dte_min: 7
      dte_max: 14
      # Tighter delta band — weekly gamma is unforgiving, stay further OTM.
      csp_delta_min: 0.15
      csp_delta_max: 0.25
      cc_delta_min: 0.15
      cc_delta_max: 0.25
      # Close earlier — capture theta then redeploy capital.
      profit_close_pct: 50
      # Higher trigger to roll because weeklies move into ITM faster.
      roll_trigger_delta: 0.45
      # IVR soft filter — see monthly_wheel.
      ivr_min: 30
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150
      # CSP stop-loss — see monthly_wheel.
      csp_stop_loss_mult: 2.0
      # TICKET-005: delta hard stop. Weekly gamma punishes patience — at 0.55
      # delta on a 5-DTE put, a single bad day can take you to 0.80+. Action
      # 'close' exits immediately rather than rolling (the dte_max=14 cap
      # gives the roll evaluator very little forward room). Fallback DTE is
      # half the dte_max so a freshly-opened 7-DTE position at delta 0.55
      # still triggers the fallback if anything weird happens at entry.
      delta_stop_threshold: 0.55
      delta_stop_action: close
      delta_stop_roll_fallback_dte: 7
      delta_stop_stuck_alert_ticks: 12

  - id: put_spread
    display_name: "Bull Put Spread"
    type: vertical_spread
    enabled: true
    max_concurrent: 2           # $5k sim: ≤2 so condor/calendar also get slots under the global cap of 4
    params:
      direction: bull_put
      dte_min: 30
      dte_max: 45
      short_delta_min: 0.20
      short_delta_max: 0.30
      # $5 width sized for the mega-cap universe ($150–$700 underlyings).
      # A $1 width yields near-zero credit at 25Δ on these strikes.
      spread_width_dollars: 5.0
      # Cap per-package max-loss exposure so quantity stays small while we
      # learn how the strategy behaves on this universe.
      max_capital_per_spread_usd: 500
      profit_close_pct: 50
      # Sprint 12 sub-sprint 1: DTE 7 → 21. The "21-DTE rule" is the
      # most-replicated finding in retail options research — gamma
      # acceleration in the final 21 days overwhelms remaining theta and
      # produces the bulk of max-loss outcomes. tastytrade 200K+ trade
      # analysis + Option Alpha independent backtest agree.
      time_close_dte: 21
      # 2026-07-06 backtest (scripts/backtest_spread_stops): the Sprint-12 2×
      # stop was giving up more than half the strategy's expectancy — 58% of
      # its stop-outs recovered by the DTE-21 close ($4.06 vs $9.62/trade
      # over 1,136 paired trades; same verdict in the 5y bear-inclusive
      # window). On a defined-risk spread the DTE-21 close already caps the
      # tail, so the stop mostly converts recoverable drawdowns into realized
      # losses. Loosened 2.0 → 3.0 (evidence-backed half-step, $8.09/trade);
      # 0 = width-as-stop is the full step if 3.0 proves out live.
      stop_loss_mult: 3.0
      # Sprint 12 sub-sprint 5: IVR soft filter — see monthly_wheel.
      # 2026-07-01 audit: 30 was a de-facto pause — the whole mega-cap universe
      # sits at IVR 13-25 in a calm bull, so the floor skipped ~every name ~every
      # day. 20 re-opens the universe; the (hidden, selector-level) 25%-of-width
      # min-credit floor still directly gates whether the premium is worth it.
      ivr_min: 20
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150

  # $5k sim: low-price-name variant of the bull put spread (CCL/INTC/SOFI/BAC/AAL
  # in universe.yaml). Same structure as put_spread but a NARROW $2 width — a $5
  # width on a $15-40 stock pushes the long leg near-worthless (awful credit-to-
  # risk, basically a naked put). Per-ticker width overrides aren't wired for
  # spreads, so a dedicated strategy is the clean way to run cheap names at the
  # right width — mirrors the monthly/weekly wheel split.
  - id: narrow_put_spread
    display_name: "Bull Put Spread (low-price)"
    type: vertical_spread
    enabled: true
    max_concurrent: 2
    params:
      direction: bull_put
      dte_min: 30
      dte_max: 45
      short_delta_min: 0.20
      short_delta_max: 0.30
      spread_width_dollars: 2.0
      max_capital_per_spread_usd: 250
      bid_ask_spread_max_pct: 15       # $5k sim: cheaper names quote wider than mega-caps — reject the worst fills
      profit_close_pct: 50
      time_close_dte: 21
      stop_loss_mult: 3.0              # 2026-07-06: loosened with put_spread — see the rationale there
      ivr_min: 20                      # 2026-07-01 audit: 30 was a de-facto pause (see put_spread)
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150

  - id: bear_call_spread
    display_name: "Bear Call Spread"
    type: vertical_spread
    enabled: false              # $5k sim: out of scope (you chose bull-put only on the credit-spread side)
    max_concurrent: 4
    params:
      direction: bear_call
      dte_min: 30
      dte_max: 45
      short_delta_min: 0.20
      short_delta_max: 0.30
      # $5 width — same sizing as put_spread for cross-strategy comparability.
      spread_width_dollars: 5.0
      max_capital_per_spread_usd: 500
      # Sprint 12 sub-sprint 3: bear-call profit target tightened to 35%
      # (vs bull-put 50%). Asymmetric — equity indices have structural
      # upward drift and IV skew makes calls pay less credit at equivalent
      # delta. Faster exit reduces time exposed to melt-up scenarios.
      # No published A/B study; logic-based off the asymmetry data.
      profit_close_pct: 35
      # See put_spread above. Same rule applies to bear-call spreads.
      time_close_dte: 21
      # Tighter stop than bull puts (2× → 1.5×). Bear-call asymmetric
      # melt-up risk: when equity indices break upward they do so violently,
      # so waiting for 2× often means realized loss is close to max.
      stop_loss_mult: 1.5
      # Sprint 12 sub-sprint 5: IVR soft filter — see monthly_wheel.
      ivr_min: 30
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150

  # TICKET-014: Iron Condor — defined-risk neutral-range structure on
  # liquid indices. enabled: false by design — the operator turns this
  # on AFTER paper-validating the strategy on SPY/QQQ/IWM. Sized via
  # max_capital_per_condor_usd; news_check fires the neutral_range
  # profile (block on FOMC/CPI/major data inside the holding window).
  # Universe membership is in config/universe.yaml — SPY/QQQ/IWM have
  # iron_condor added to their strategies: lists.
  - id: iron_condor
    display_name: "Iron Condor"
    type: iron_condor
    enabled: true               # $5k sim: ON (defined-risk neutral structure)
    max_concurrent: 2
    params:
      dte_min: 30
      dte_max: 45
      short_put_delta_target: 0.16     # ~1 SD on the put side
      short_call_delta_target: 0.16    # ~1 SD on the call side
      wing_width: 5.0                  # $5 wings — same as the vertical strategies
      min_credit_pct: 30               # total credit ≥ 30% of wing width
      profit_close_pct: 25             # tighter than verticals (50%) — short gamma both sides
      time_close_dte: 21               # close when either short ≤ 21 DTE
      max_capital_per_condor_usd: 500  # $5k sim: ~10% of the account per condor (was 1000)
      ivr_min: 30
      # Regime gate (2026-07-01 audit): condor/calendar are allowed whenever
      # bullish premium is (BULL_TREND or NEUTRAL, i.e. csps_allowed); blocked
      # only in BEAR_TREND/HIGH_VOL. The old AND-combine required NEUTRAL, which
      # a grinding bull never produces — both strategies were structurally
      # zero-trade. See risk/limits.py::_rule_regime_multi_leg.
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150

  # TICKET-015: Poor Man's Covered Call. A deep-ITM LEAP long (stock
  # substitute) with OTM short calls sold against it for income. Defined
  # risk = the long debit. The wheel substitute for quality names the cash-
  # secured account can't afford outright. enabled: false until paper-
  # validated. Sized at 1 long + 1 short per position (max_concurrent caps
  # the number of concurrent PMCC positions). NOTE: with this strategy on,
  # the sum of per-strategy max_concurrent (2+4+4+4+2+3=19) exceeds the
  # account.max_concurrent_total ceiling (14) — that global cap will bind
  # if every strategy is enabled at once; tune allocation at go-live.
  - id: pmcc
    display_name: "Poor Man's Covered Call"
    type: pmcc
    enabled: true               # $5k sim: ON for LOW-PRICE underlyings (CCL/INTC/SOFI/BAC) — a 0.80Δ LEAP there is ~$300-700, fits the account
    max_concurrent: 2
    params:
      long_dte_min: 90
      long_dte_max: 180
      long_delta_target: 0.80          # deep ITM stock substitute
      short_dte_min: 7
      short_dte_max: 30
      short_delta_target: 0.27         # OTM income
      # HARD RULE: short strike must be strictly above the long breakeven
      # (long.strike + long_debit/share). Enforced in the selector AND the
      # risk gate (_rule_pmcc_short_above_breakeven).
      profit_close_pct_short: 50       # close short at 50% of premium captured
      short_time_close_dte: 1          # close/roll short when it reaches 1 DTE
      # Long-leg roll (2026-07-06 sprint): 30 DTE was far past the theta
      # cliff — at 90-180 DTE entries, extrinsic decay accelerates well
      # before 60 DTE, so by 30 the long has bled for weeks. Roll at 60 DTE,
      # or earlier if delta decays below 0.70 (below that the long stops
      # behaving like stock and the structure loses its covered-call
      # economics). The 0.80 entry delta vs 0.70 roll floor is the churn
      # buffer. Delta needs live quotes; on quote outage the DTE trigger is
      # the backstop.
      long_roll_dte: 60                # roll the long forward when DTE < this
      long_roll_delta: 0.70            # ...or when current long delta < this (0/absent = off)
      max_capital_per_position_usd: 1500   # $12k book (2026-07-01, was 1000 on $5k): opens a 2nd affordable LEAP tier (was 10000) — a 0.80Δ LEAP on CCL/INTC/SOFI/BAC is $300-700
      # $5k sim: reject illiquid LEAPs. The 0.80Δ long is the most expensive leg,
      # so a bad fill hurts most — and a 2026-06-18 probe showed CCL/BAC/SOFI
      # LEAPs at 12-72% spreads. At 10% those are filtered out, so PMCC stays
      # dormant until a name has a tight, affordable LEAP (the honest $5k reality).
      bid_ask_spread_max_pct: 10
      ivr_min: 25                      # lower than the wheel — PMCC tolerates flatter IV
      # Regime: PMCC long is a bullish bet, gated on csps_allowed (same flag a
      # CSP uses). PMCC short is covered premium → not regime-gated.
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150

  # TICKET-016: Calendar Spread — same-strike front/back calls, net DEBIT.
  # The COUNTER-CYCLICAL piece: it wants LOW IV (INVERTED ivr_max gate, the
  # opposite of premium strategies) and a range-bound underlying. Profits from
  # front-leg theta decay + rising IV (long vega). Defined risk = the debit.
  # enabled: false until paper-validated. Force-closed at 2 DTE so the
  # partial-expiry path stays unreachable (reconciler guard flags it if not).
  # First net-debit MLEG open — verify the limit-price sign at Stage 2 parity.
  - id: calendar
    display_name: "Calendar Spread"
    type: calendar
    enabled: true               # $5k sim: ON (low-IV, long-vega, defined risk = the debit)
    max_concurrent: 2
    params:
      short_dte_min: 7
      short_dte_max: 21
      long_dte_min: 45
      long_dte_max: 75
      option_type: call                # v1: call only
      max_debit_per_spread_usd: 400        # $12k book (2026-07-01, was 250): $250 blocked nearly every calendar
      bid_ask_spread_max_pct: 20       # $5k sim: two-leg, naturally wider — reject the worst cheap-name fills (indices are tight, unaffected)
      profit_close_pct: 25             # of the net debit
      time_close_short_dte: 2          # force-close when front ≤ 2 DTE
      ivr_max: 35                      # INVERTED — enter only when IVR is LOW
      # Regime: treated like iron_condor (range-bound = both wings allowed =
      # NEUTRAL in the 4-bucket scheme). Upgrade to *_LOW_IV after TICKET-013.
      # Drawdown circuit breaker — see monthly_wheel.
      auto_disable_drawdown_usd: -300
      drawdown_warning_usd: -150

  # Directional SPY swing (validated backtest edge). LIVE on Alpaca PAPER as of
  # sub-sprint 2.4b: full lifecycle shipped (signal → deep-ITM long entry →
  # SPY-level exits → reconciler → dashboard), risk gate fixed (premium-based
  # notional + regime-exempt). Places PAPER orders. Flip dry_run back to true to
  # re-mute without disabling. Sizing = 1 contract.
  - id: spy_swing_opt
    display_name: "SPY Swing (deep-ITM options)"
    type: swing
    enabled: true
    max_concurrent: 1
    params:
      symbol: SPY
      dry_run: false                # 2.4b GO-LIVE (paper): places real paper orders on signal.
      # Validated config (see backtest sub-sprint 1): deep-ITM long, ~60 DTE,
      # prior-day-level stop, 1.5R target, 1-day min-hold, 7-day time stop, NO
      # 5-min opposite-cross exit, 200-SMA regime gate. Consumed in 2.2.
      entry_delta: 0.90
      dte_target: 60
      stop_mode: prior_day_level
      reward_risk: 1.5
      min_hold_days: 1
      max_hold_days: 7
      # AI audit item #1: pre-FOMC drift tilt — when NO technical signal fires
      # and an FOMC decision is TOMORROW, take a small long (1 contract, normal
      # stop, max_hold_days=1 → time-exit on decision day). Drift documented
      # through 2024 (Sharpe ~0.6, in-market ~5% of days) but regime-dependent.
      # Armed 2026-07-01 for the paper proof-of-concept — judge over 8-10
      # meetings before any real-money trust. Next FOMC: 2026-07-28.
      fomc_tilt_enabled: true
      auto_disable_drawdown_usd: -300
