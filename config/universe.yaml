# WheelBot trading universe. Curated. Never auto-add tickers without human review.
# See spec §6.
#
# Tier enforcement:
#   tier 1 — auto-traded if all risk gates pass
#   tier 2 — requires LLM screener + risk gates
#   tier 3 — requires manual human approval per cycle
#
# `strategies:` lists which strategies (from config.yaml strategies block)
# are allowed to trade this ticker. A ticker can belong to multiple
# strategies — but in practice we keep the universes separate so each
# strategy is comparable in isolation.

tickers:
  # ============================================================
  # monthly_wheel — 30-45 DTE CSPs, stocks you'd own
  # ============================================================
  - symbol: F
    name: "Ford Motor Company"
    tier: 1
    strategies: [monthly_wheel]
    notes: "Liquid, dividend, low IV but reliable. Good for first live trades."
    overrides:
      csp_delta_max: 0.25         # tighter delta given low premium

  - symbol: BAC
    name: "Bank of America"
    tier: 1
    strategies: [monthly_wheel]
    notes: "Low IV but tight spreads, very liquid."

  - symbol: NOK
    name: "Nokia"
    tier: 1
    strategies: [monthly_wheel]

  - symbol: SOFI
    name: "SoFi Technologies"
    tier: 1
    strategies: [monthly_wheel]
    notes: "Higher IV fintech. Good monthly premium."

  - symbol: T
    name: "AT&T"
    tier: 1
    strategies: [monthly_wheel]
    notes: "Low IV, dividend, sub-$30/share — fits small accounts."

  - symbol: VZ
    name: "Verizon Communications"
    tier: 1
    strategies: [monthly_wheel]
    notes: "Telco income stock; quiet IV."

  - symbol: INTC
    name: "Intel"
    tier: 1
    strategies: [monthly_wheel]
