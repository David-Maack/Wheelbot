# WheelBot trading universe. Curated. Never auto-add tickers without human review.
# See spec §6.
#
# Tier enforcement:
#   tier 1 — auto-traded if all risk gates pass
#   tier 3 — parked — kept on file with rationale, never traded
# (Tier 2 — "requires an LLM screener score" — went with the screener in the
# 2026-10-27 two-strategy cleanup; no ticker is tier 2 any more.)
#
# Admission criteria for a new name (ALL must pass):
#   - Would I be happy owning 200 shares for 6 months at the strike I'd sell?
#   - Median daily volume > 5M
#   - No going-concern / dilution risk in next 12 months
#   - Not crypto-beta or single-product story
#   - Per-contract capital commitment fits within strategy max_position_pct_of_account
#
# `strategies:` lists which strategies (from config.yaml strategies block)
# are allowed to trade this ticker. An empty `strategies: []` means the
# ticker is parked.
#
# Last reviewed: 2026-10-27 (two-strategy cleanup: monthly_wheel + zero_dte;
# symbols that only served the retired strategies were removed — git history
# has them).

tickers:
  # ============================================================
  # monthly_wheel — 30-45 DTE CSPs, stocks you'd own
  # ============================================================
  - symbol: F
    name: "Ford Motor Company"
