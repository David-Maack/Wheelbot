    strategies: [zero_dte]
    notes: "Same-day bull put (2026-10 rebuild)."

  # ============================================================
  # Parked (tier 3) — never traded
  # ============================================================
  - symbol: PLTR
    name: "Palantir"
    tier: 3   # demoted 2026-06-03 (TICKET-020): ~$27K/contract capital req;
              # momentum-driven, not premium-decay friendly.
    strategies: []
    notes: "Heavy retail flow, weeklies trade actively. PARKED."

  - symbol: PLUG
    name: "Plug Power"
    tier: 3   # demoted 2026-06-03 (TICKET-020): 49% YoY share dilution, -$1.68B TTM,
              # going-concern risk; fails the 200-share-for-6-months gate.
    strategies: []
    notes: "Volatile, weekly options trade. PARKED — going-concern risk."

  - symbol: MARA
    name: "Marathon Digital"
    tier: 3   # demoted 2026-06-03 (TICKET-020): pure crypto-beta (Bitcoin miner),
              # fails the "not crypto-beta or single-product story" gate.
    strategies: []
