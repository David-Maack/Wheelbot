  # ============================================================
  - symbol: HOOD
    name: "Robinhood Markets"
    tier: 2
    strategies: [weekly_wheel]
    notes: "Wheel the broker. Liquid weeklies; high IV."

  - symbol: PLTR
    name: "Palantir"
    tier: 2
    strategies: [weekly_wheel]
    notes: "Heavy retail flow, weeklies trade actively."

  - symbol: PLUG
    name: "Plug Power"
    tier: 2
    strategies: [weekly_wheel]
    notes: "Volatile, weekly options trade."

  - symbol: RIVN
    name: "Rivian"
    tier: 2
    strategies: [weekly_wheel]
    overrides:
      max_position_pct_of_account: 20

  - symbol: MARA
    name: "Marathon Digital"
    tier: 2
    strategies: [weekly_wheel]
    notes: "BTC-correlated, high IV."

  - symbol: AAL
    name: "American Airlines"
    tier: 1
    strategies: [weekly_wheel]
    notes: "Sub-$20 airline, weeklies + earnings IV."

