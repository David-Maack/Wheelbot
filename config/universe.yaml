# WheelBot trading universe. Curated. Never auto-add tickers without human review.
# See spec §6.
#
# Tier enforcement:
#   tier 1 — auto-traded if all risk gates pass
#   tier 2 — requires LLM screener + risk gates
#   tier 3 — banned — never tradable by any strategy
#
# Tier 2 admission criteria (ALL must pass):
#   - Would I be happy owning 200 shares for 6 months at the strike I'd sell?
#   - Median daily volume > 5M
#   - No going-concern / dilution risk in next 12 months
#   - Not crypto-beta or single-product story
#   - Per-contract capital commitment fits within strategy max_position_pct_of_account
#
# `strategies:` lists which strategies (from config.yaml strategies block)
# are allowed to trade this ticker. A ticker can belong to multiple
# strategies — but in practice we keep the universes separate so each
# strategy is comparable in isolation. An empty `strategies: []` means
# the ticker is parked — kept on file with rationale for future revival.
#
# Last reviewed: 2026-06-03 (TICKET-020 — weekly_wheel prune)

