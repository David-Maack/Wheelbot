  - symbol: SPY
    name: "S&P 500 ETF"
    tier: 1
    # TICKET-014: SPY is in BOTH put_spread (directional) and iron_condor
    # (neutral-range, defined risk on both sides). Overlap is intentional:
    # the disjoint-universes comment elsewhere was about avoiding accidental
    # short strangles from put_spread + bear_call_spread on the same ticker.
    # That accident does NOT happen with iron_condor since the condor is
    # itself a defined-risk structure with both wings — there's no implicit
    # leftover from one strategy that could combine with another.
    # TICKET-015/016: pmcc + calendar added — index LEAP substitute + low-IV
    # calendar. Each strategy on SPY holds independent, separately-keyed
    # positions.
    strategies: [put_spread, iron_condor, pmcc, calendar]
    notes: "Broad-market hedge candidate too. Iron condor + PMCC + calendar target — deepest liquidity."

