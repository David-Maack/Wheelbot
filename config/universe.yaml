  # put_spread — 30-45 DTE bull put credit spreads, defined risk
  # ============================================================
  - symbol: AAPL
    name: "Apple"
    tier: 1
    strategies: [put_spread]
    notes: "Mega-cap, tight option spreads."

  - symbol: MSFT
