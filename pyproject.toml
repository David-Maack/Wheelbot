[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wheelbot"
version = "0.1.0"
description = "Automated options-wheel trading bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "David Maack" }]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
broker = [
    "alpaca-py>=0.30",
    "tastytrade>=9.0",
    "httpx>=0.27",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "mistune>=3.0",
]
intelligence = [
    "anthropic>=0.40",
]
data = [
    "yfinance>=0.2",
    "numpy>=1.26",
    "scipy>=1.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "platforms",
    "data",
    "strategies",
    "execution",
    "intelligence",
    "risk",
    "dashboard",
    "db",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits a live broker sandbox; needs creds in config/secrets.env",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
