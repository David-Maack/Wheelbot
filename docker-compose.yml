services:
  wheelbot:
    build: .
    image: wheelbot:latest
    container_name: wheelbot
    restart: unless-stopped
    env_file:
      - ./config/secrets.env
    volumes:
      - wheelbot-storage:/mnt/wheelbot-storage
      - ./config/config.local.yaml:/opt/wheelbot/config/config.local.yaml:ro
      - ./config/universe.yaml:/opt/wheelbot/config/universe.yaml:ro
    healthcheck:
      # Smoke check: the bot must be able to open the SQLite file. The deeper
      # "is the loop ticking" check is the dashboard's /healthz endpoint —
      # surface that via the dashboard service.
      test: ["CMD", "python", "-c", "import sqlite3, os; sqlite3.connect(os.environ.get('WHEELBOT_DB_PATH','/mnt/wheelbot-storage/wheelbot.db')).execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
    # Cron jobs (screener, regime, IV ingest, backup) run from the LXC host
    # crontab via `docker exec wheelbot python -m scripts.X`. See README.

  dashboard:
    build: .
    image: wheelbot:latest
    container_name: wheelbot-dashboard
    restart: unless-stopped
    depends_on:
      - wheelbot
    env_file:
      - ./config/secrets.env
    volumes:
      - wheelbot-storage:/mnt/wheelbot-storage
      - ./config/config.local.yaml:/opt/wheelbot/config/config.local.yaml:ro
      - ./config/universe.yaml:/opt/wheelbot/config/universe.yaml:ro
    command: >
      uvicorn dashboard.app:create_app --factory
      --host 0.0.0.0 --port 8889
    ports:
      # 0.0.0.0 so the tailnet (100.73.1.46) can reach it; HTTP Basic auth
      # guards the dashboard. Was hand-edited on the LXC for a month — now
      # committed so deploys stop choking on a dirty tree.
      - "8889:8889"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8889/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Ops MCP: read tools + guarded controls over authenticated streamable HTTP.
  # Bound 0.0.0.0 like the dashboard so the tailnet (100.73.1.46:8890) can
  # reach it. Requires WHEELBOT_MCP_TOKEN in secrets.env (server refuses to
  # start without it; unauthenticated calls get 401).
  mcp:
    build: .
    image: wheelbot:latest
    container_name: wheelbot-mcp
    restart: unless-stopped
    depends_on:
      - wheelbot
    env_file:
      - ./config/secrets.env
    volumes:
      - wheelbot-storage:/mnt/wheelbot-storage
      - ./config/config.local.yaml:/opt/wheelbot/config/config.local.yaml:ro
      - ./config/universe.yaml:/opt/wheelbot/config/universe.yaml:ro
    command: ["python", "-m", "scripts.run_mcp"]
    ports:
      - "8890:8890"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8890), timeout=5).close()"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  wheelbot-storage:
    # Bind to the LXC mountpoint backed by the Proxmox AI SSD
    # (mp0: /mnt/ai-ssd/wheelbot → /mnt/wheelbot-storage) so the DB and
    # backups live off the 16G container rootfs. The mountpoint must exist
    # on the LXC before `docker compose up`.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/wheelbot-storage
