# OS-level logrotate fallback for hosts that prefer system rotation.
# WheelBot's core/logs.py already uses a TimedRotatingFileHandler (daily, 30
# backups), so this file is OPTIONAL — install it only if you'd rather have
# logrotate own the rotation. Don't run both at once.
#
# Install:  sudo cp ops/logrotate.conf /etc/logrotate.d/wheelbot
# Test:     sudo logrotate -d /etc/logrotate.d/wheelbot

/mnt/wheelbot-storage/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
